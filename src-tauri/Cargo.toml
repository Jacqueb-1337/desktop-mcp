[package]
name = "desktop-mcp"
version = "0.3.1"
description = "Tray-first Windows/Linux MCP agent"
authors = ["Desktop MCP Contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "desktop_mcp_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "desktop-mcp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
