[package]
name = "desktop-mcp-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Local, workspace-scoped stdio MCP server for Desktop MCP"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
git2 = { version = "0.21", default-features = false }
cap-std = "4"

[dev-dependencies]
tempfile = "3"
