[package]
name = "desktop-mcp-gateway"
version = "0.3.1"
edition = "2021"
rust-version = "1.90"
description = "TLS gateway for authenticated, identity-only Desktop MCP agent presence"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }

tempfile = "3"
