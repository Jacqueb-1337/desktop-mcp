name: Linux gateway release packages
on:
  workflow_dispatch:
    inputs:
      debian_revision:
        description: 'Optional positive Debian packaging revision for manual builds'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools binutils dpkg-dev
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 "${{ matrix.target }}"
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 test --locked --manifest-path gateway/Cargo.toml
          cargo +1.90.0 build --locked --release --target "${{ matrix.target }}" --manifest-path gateway/Cargo.toml
          bash docs/test-gateway-deb.sh
          sudo bash docs/test-gateway-package-lifecycle.sh
      - name: Package and verify actual binary
        shell: bash
        env:
          DEBIAN_REVISION: ${{ inputs.debian_revision }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("gateway/Cargo.toml","rb"))["package"]["version"])')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
          fi
          package_version="$version"
          if [[ -n "$DEBIAN_REVISION" ]]; then
            [[ "$GITHUB_REF_TYPE" != tag && "$DEBIAN_REVISION" =~ ^[1-9][0-9]*$ ]]
            package_version="$version-$DEBIAN_REVISION"
          fi
          bin="gateway/target/${{ matrix.target }}/release/desktop-mcp-gateway"
          bash docs/build-gateway-deb.sh "$bin" "$package_version" "${{ matrix.arch }}" dist
          package="dist/desktop-mcp-gateway_${package_version}_${{ matrix.arch }}.deb"
          [[ "$(dpkg-deb -f "$package" Version)" == "$package_version" ]]
          [[ "$(dpkg-deb -f "$package" Architecture)" == "${{ matrix.arch }}" ]]
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          dpkg-deb -x "$package" "$tmp"
          cmp "$bin" "$tmp/usr/lib/desktop-mcp/desktop-mcp-gateway"
          [[ "$("$tmp/usr/lib/desktop-mcp/desktop-mcp-gateway" --version)" == "desktop-mcp-gateway $version" ]]
          (cd dist && sha256sum -c *.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-gateway-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  attach:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-gateway-*
          merge-multiple: true
          path: dist
      - name: Attach both packages to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            package="desktop-mcp-gateway_${version}_${arch}.deb"
            test -f "$package" && test -f "$package.sha256"
            sha256sum -c "$package.sha256"
          done
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" *.deb *.sha256
